# The Phase 0 gate: the installer builds and its window *opens* on Windows,
# macOS and Linux — in CI, not only on the development VM.
#
# Tauri uses the system webview, so "cross-platform" means three rendering
# engines, not one: WebKitGTK on Linux, WKWebView on macOS, WebView2 on Windows.
# Differences between them never show up in a typecheck. This is the cheapest
# thing to do on the first commit and the most expensive to put off.
#
# The check is not a screenshot. The application is genuinely run in smoke mode
# and waits for an ordered set of signals — a later one cannot arrive unless the
# one before it did:
#
#   1. webview-loaded  — the page loaded, the bundle ran, React mounted
#   2. ipc-roundtrip   — Rust's answer reached the screen and went back again
#   3. data-roundtrip  — SQLite was written and read back intact
#
# All present: exit 0. Past the timeout: exit 1, naming which signal never came.

name: Skeleton · three platforms

# Runs on pull requests only.
#
# It used to run on pushes to main as well, which meant every merged change was
# built three times on three platforms: once for the PR, once for the push to
# main, and once more by the release workflow. The second of those told nobody
# anything — branch protection requires the PR to be green *and* up to date with
# main, so the merge result is the commit that was already tested.
#
# A branch pushed without a PR is not checked either. That is deliberate: the
# gate is the merge into main, and every merge into main goes through a PR.
#
# Main is still verified after a merge — the release workflow builds it on all
# three platforms and runs the application before publishing anything.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Successive pushes to the same PR do not all need to finish; only the last
# commit will be merged.
concurrency:
  group: skeleton-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.0"

jobs:
  skeleton:
    name: ${{ matrix.webview }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            webview: WebKitGTK (Linux)
          - os: macos-14
            webview: WKWebView (macOS)
          - os: windows-latest
            webview: WebView2 (Windows)

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # WebKitGTK and its development headers are not on the Ubuntu runner, and
      # Xvfb is the only display it has. macOS and Windows already ship their
      # own webview.
      - name: Install the Linux webview and display
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The engine is ~176 MB and is not in the repository, so a clean checkout
      # has none. It is fetched here and verified against the sha256 pinned in
      # apps/desktop/opencode.json — a mismatch stops the build rather than
      # shipping an archive nobody vouched for.
      #
      # Cached by version and target, because 176 MB per job adds up.
      - name: Cache the OpenCode engine
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: apps/desktop/src-tauri/binaries
          key: opencode-${{ hashFiles('apps/desktop/opencode.json') }}-${{ runner.os }}-${{ runner.arch }}

      - name: Fetch the OpenCode engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: bun run sidecar

      - name: Build the interface
        working-directory: apps/ui
        run: bun run build

      # A green CI step does not necessarily do anything. The step above can
      # pass while producing nothing at all, and the `tauri build` that follows
      # would quietly use a stale output.
      - name: Make sure the interface really exported
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/ui/out/index.html \
            || { echo "apps/ui/out/index.html tidak ada — next build tidak menghasilkan apa pun"; exit 1; }
          echo "out/ berisi $(find apps/ui/out -type f | wc -l) berkas"

      - name: Build the installer
        working-directory: apps/desktop
        run: bun run tauri build

      - name: Name the installers that were built
        shell: bash
        run: |
          set -euo pipefail
          bundle=apps/desktop/src-tauri/target/release/bundle
          test -d "${bundle}" || { echo "tidak ada direktori bundle — tidak ada installer yang terbangun"; exit 1; }
          echo "### ${{ matrix.webview }} · installer" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          find "${bundle}" -maxdepth 2 -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) \
            -exec ls -lh {} \; | tee -a "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"

      # Three launches, not seven.
      #
      # Every launch emits the three core signals, so a run that checked only
      # those was pure repetition. And the expectations stack: one process can be
      # asked to prove the engine starts from the bundle, that a deep link
      # arrived, and that data was written — all at once. Only two things
      # genuinely need a process of their own: reading data back after the first
      # has died, and running with the engine taken away.
      #
      # The binary under test must be the one `tauri build` produced. The debug
      # or release profile is not what decides it: a plain `cargo build --release`
      # still produces a dev context and loads devUrl instead of the embedded
      # export. Never slip a `cargo build` between the build and these steps.
      - name: Run it, write data, and take the deep link
        shell: bash
        env:
          RANTAI_SMOKE: "1"
          RANTAI_SMOKE_ENGINE: "present"
          RANTAI_SMOKE_PERSIST: "write"
          RANTAI_SMOKE_TIMEOUT_MS: "180000"
        run: |
          set -euo pipefail
          export RANTAI_SMOKE_REPORT="${RUNNER_TEMP}/rantai-smoke-first.json"

          marker="persisted-${GITHUB_RUN_ID}-${RUNNER_OS}"
          echo "RANTAI_SMOKE_PERSIST_MARKER=${marker}" >> "${GITHUB_ENV}"
          export RANTAI_SMOKE_PERSIST_MARKER="${marker}"

          case "${RUNNER_OS}" in
            Windows) binary=apps/desktop/src-tauri/target/release/rantai.exe ;;
            macOS)   binary="apps/desktop/src-tauri/target/release/bundle/macos/Rantai.app/Contents/MacOS/Rantai" ;;
            *)       binary=apps/desktop/src-tauri/target/release/rantai ;;
          esac

          # The deep link rides along on the platforms where the system hands it
          # over as a command-line argument. macOS uses Apple Events, so it gets
          # its own non-blocking probe below rather than being allowed to fail
          # this step over something genuinely unknown.
          #
          # Written out branch by branch rather than with an argument array.
          # macOS ships bash 3.2, where `"${arr[@]}"` on an *empty* array counts
          # as an unbound variable under `set -u` — and macOS is the one platform
          # where the array would be empty. It failed there and nowhere else.
          if [ "${RUNNER_OS}" = "macOS" ]; then
            "${binary}"
          else
            export RANTAI_SMOKE_DEEP_LINK="GRANTTESTCI1234567890"
            link="openwork://den-auth?grant=${RANTAI_SMOKE_DEEP_LINK}"
            if [ "${RUNNER_OS}" = "Linux" ]; then
              xvfb-run -a "${binary}" "${link}"
            else
              "${binary}" "${link}"
            fi
          fi

      # Release 1 promises a conversation is "saved in SQLite and can be
      # reopened". That is only provable across two processes — a check inside
      # one can pass entirely from an in-memory cache without a byte touching
      # disk. This is the second process.
      - name: Read the data back after the application closed
        shell: bash
        env:
          RANTAI_SMOKE: "1"
          RANTAI_SMOKE_PERSIST: "read"
          RANTAI_SMOKE_TIMEOUT_MS: "120000"
        run: |
          set -euo pipefail
          export RANTAI_SMOKE_REPORT="${RUNNER_TEMP}/rantai-smoke-read.json"

          case "${RUNNER_OS}" in
            Windows) binary=apps/desktop/src-tauri/target/release/rantai.exe ;;
            macOS)   binary="apps/desktop/src-tauri/target/release/bundle/macos/Rantai.app/Contents/MacOS/Rantai" ;;
            *)       binary=apps/desktop/src-tauri/target/release/rantai ;;
          esac

          if [ "${RUNNER_OS}" = "Linux" ]; then
            xvfb-run -a "${binary}"
          else
            "${binary}"
          fi

      # The Phase 2 gate: run without the engine and make sure the message names
      # the cause. Now that the engine really is bundled, pointing
      # RANTAI_OPENCODE at nothing is not enough — the application would find its
      # sidecar. So the sidecar is moved aside, which is a truer test anyway:
      # that is what a corrupted installation looks like.
      - name: Run with the engine taken away
        shell: bash
        env:
          RANTAI_SMOKE: "1"
          RANTAI_SMOKE_ENGINE: "absent"
          RANTAI_SMOKE_TIMEOUT_MS: "120000"
        run: |
          set -euo pipefail
          export RANTAI_SMOKE_REPORT="${RUNNER_TEMP}/rantai-smoke-absent.json"

          case "${RUNNER_OS}" in
            Windows)
              binary=apps/desktop/src-tauri/target/release/rantai.exe
              engine=apps/desktop/src-tauri/target/release/opencode.exe
              export RANTAI_OPENCODE='C:\nowhere\opencode.exe'
              ;;
            macOS)
              binary="apps/desktop/src-tauri/target/release/bundle/macos/Rantai.app/Contents/MacOS/Rantai"
              engine="apps/desktop/src-tauri/target/release/bundle/macos/Rantai.app/Contents/Resources/opencode"
              export RANTAI_OPENCODE=/nowhere/opencode
              ;;
            *)
              binary=apps/desktop/src-tauri/target/release/rantai
              engine=apps/desktop/src-tauri/target/release/opencode
              export RANTAI_OPENCODE=/nowhere/opencode
              ;;
          esac

          test -f "${engine}" || { echo "expected a bundled engine at ${engine}"; exit 1; }
          mv "${engine}" "${engine}.aside"
          trap 'mv "${engine}.aside" "${engine}" 2>/dev/null || true' EXIT

          if [ "${RUNNER_OS}" = "Linux" ]; then
            xvfb-run -a "${binary}"
          else
            "${binary}"
          fi

      # macOS hands deep links over through Apple Events rather than command-line
      # arguments, so the approach above may not hold there. Run as a
      # non-blocking probe: it says whether the path is the same without holding
      # a release over something genuinely unknown. Once it is green a few times,
      # continue-on-error comes off and this folds into the first launch.
      - name: Probe the sign-in link on macOS (non-blocking)
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        env:
          RANTAI_SMOKE: "1"
          RANTAI_SMOKE_DEEP_LINK: "GRANTTESTCI1234567890"
          RANTAI_SMOKE_TIMEOUT_MS: "60000"
        run: |
          set -euo pipefail
          export RANTAI_SMOKE_REPORT="${RUNNER_TEMP}/rantai-smoke-deeplink.json"
          binary="apps/desktop/src-tauri/target/release/bundle/macos/Rantai.app/Contents/MacOS/Rantai"
          "${binary}" "openwork://den-auth?grant=${RANTAI_SMOKE_DEEP_LINK}"

      # The Phase 2 gate also asks for no orphaned processes. If anything above
      # left an OpenCode alive, it shows up here.
      - name: Make sure no engine was left behind
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if pgrep -x opencode > /dev/null 2>&1; then
            echo "an opencode process was left behind:"
            pgrep -ax opencode
            exit 1
          fi
          echo "no engine process was left behind"

      # The report names which signals arrived, so a failure says what broke —
      # not merely that something did.
      - name: Report
        if: always()
        shell: bash
        run: |
          laporan="${RANTAI_SMOKE_REPORT:-${RUNNER_TEMP}/rantai-smoke.json}"
          echo "### ${{ matrix.webview }} · sinyal" >> "${GITHUB_STEP_SUMMARY}"
          if [ -f "${laporan}" ]; then
            echo '```json' >> "${GITHUB_STEP_SUMMARY}"
            cat "${laporan}" >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
          else
            echo 'Aplikasi tidak pernah menulis laporan — ia gagal sebelum sampai ke sana.' >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload the installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.msi

  # Cheap, fast, and catches a different class of error than the matrix above.
  #
  # NOTE: branch protection matches required checks by name. Renaming this job
  # means every open PR would wait forever for a check that no longer reports —
  # so a rename has to happen with no PR open, and the required contexts have to
  # be updated in the same move.
  checks:
    name: Typecheck and lint
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install the Linux webview
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # This job compiles the crate too, and the Tauri build script refuses to
      # run when a declared resource is missing: "resource path
      # `binaries/opencode` doesn't exist". So even the cheap job needs the
      # engine present. Cached, so it is fetched once per version and platform.
      - name: Cache the OpenCode engine
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: apps/desktop/src-tauri/binaries
          key: opencode-${{ hashFiles('apps/desktop/opencode.json') }}-${{ runner.os }}-${{ runner.arch }}

      - name: Fetch the OpenCode engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: bun run sidecar

      - name: Rust formatting
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # This test rewrites apps/ui/app/bindings.ts from the command list in
      # Rust. It also runs the SQLite migrations against an in-memory database,
      # so mistyped SQL fails here rather than when the application opens.
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test

      # The Phase 1 gate. If the step above changed bindings.ts, the shape of
      # the data in Rust moved without that file following — and the callers in
      # Next.js may not have followed either. An unclean diff here is the only
      # guard against two definitions of the truth slowly diverging with nobody
      # noticing.
      - name: Make sure bindings.ts is current
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- apps/ui/app/bindings.ts; then
            echo
            echo "bindings.ts tidak mutakhir terhadap perintah di Rust."
            echo "Jalankan: cd apps/desktop/src-tauri && cargo test"
            echo "lalu commit apps/ui/app/bindings.ts."
            exit 1
          fi
          echo "bindings.ts mutakhir"

      # Run after bindings are confirmed current — otherwise the typecheck could
      # pass against a stale file and hide the very thing this gate guards.
      - name: Typecheck the interface
        working-directory: apps/ui
        run: bun run typecheck

      # Interface tests. The Den sign-in link parsers are tested here — the part
      # of the sign-in testable without a window, without Tauri and without Den.
      # Shrinking the untestable part as far as it will go is the whole strategy
      # of Phase 3; what is left is two native touches.
      - name: Interface tests
        working-directory: apps/ui
        run: bun test
