# The Phase 0 gate: the installer builds and its window *opens* on Windows,
# macOS and Linux — in CI, not only on the development VM.
#
# Tauri uses the system webview, so "cross-platform" means three rendering
# engines, not one: WebKitGTK on Linux, WKWebView on macOS, WebView2 on Windows.
# Differences between them never show up in a typecheck. This is the cheapest
# thing to do on the first commit and the most expensive to put off.
#
# The check is not a screenshot. The application is genuinely run in smoke mode
# and waits for an ordered set of signals — a later one cannot arrive unless the
# one before it did:
#
#   1. webview-loaded  — the page loaded, the bundle ran, React mounted
#   2. ipc-roundtrip   — Rust's answer reached the screen and went back again
#   3. data-roundtrip  — SQLite was written and read back intact
#
# All present: exit 0. Past the timeout: exit 1, naming which signal never came.

name: Skeleton · three platforms

# `push` is deliberately limited to main. It used to cover every branch as well
# as `pull_request`, and so every PR built Rust six times instead of three: one
# round for the push to its branch, another for the PR itself. Both tested the
# same commit and reported the same check names, so both appeared as "Required"
# in the merge box and the wait doubled without adding a single piece of
# information.
#
# The consequence: a branch pushed without a PR is not checked. That is
# deliberate — the gate is the merge into main, and every merge into main goes
# through a PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Successive pushes to the same PR do not all need to finish; only the last
# commit will be merged.
concurrency:
  group: skeleton-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.0"

jobs:
  skeleton:
    name: ${{ matrix.webview }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            webview: WebKitGTK (Linux)
          - os: macos-14
            webview: WKWebView (macOS)
          - os: windows-latest
            webview: WebView2 (Windows)

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # WebKitGTK and its development headers are not on the Ubuntu runner, and
      # Xvfb is the only display it has. macOS and Windows already ship their
      # own webview.
      - name: Install the Linux webview and display
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The engine is ~176 MB and is not in the repository, so a clean checkout
      # has none. It is fetched here and verified against the sha256 pinned in
      # apps/desktop/opencode.json — a mismatch stops the build rather than
      # shipping an archive nobody vouched for.
      #
      # Cached by version and target, because 176 MB per job adds up.
      - name: Cache the OpenCode engine
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: apps/desktop/src-tauri/binaries
          key: opencode-${{ hashFiles('apps/desktop/opencode.json') }}-${{ runner.os }}-${{ runner.arch }}

      - name: Fetch the OpenCode engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: bun run sidecar

      - name: Build the interface
        working-directory: apps/ui
        run: bun run build

      # A green CI step does not necessarily do anything. The step above can
      # pass while producing nothing at all, and the `tauri build` that follows
      # would quietly use a stale output.
      - name: Make sure the interface really exported
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/ui/out/index.html \
            || { echo "apps/ui/out/index.html tidak ada — next build tidak menghasilkan apa pun"; exit 1; }
          echo "out/ berisi $(find apps/ui/out -type f | wc -l) berkas"

      - name: Build the installer
        working-directory: apps/desktop
        run: bun run tauri build

      - name: Name the installers that were built
        shell: bash
        run: |
          set -euo pipefail
          bundle=apps/desktop/src-tauri/target/release/bundle
          test -d "${bundle}" || { echo "tidak ada direktori bundle — tidak ada installer yang terbangun"; exit 1; }
          echo "### ${{ matrix.webview }} · installer" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          find "${bundle}" -maxdepth 2 -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) \
            -exec ls -lh {} \; | tee -a "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"

      # The binary under test must be the one produced by `tauri build` above.
      # What decides this is not the debug or release profile: a plain
      # `cargo build --release` still produces a dev context, and the application
      # loads devUrl instead of the embedded export. Never slip a `cargo build`
      # between these two steps — it overwrites the right binary with the wrong
      # one, and the failure looks like a dead webview.
      - name: Run the webview check
        shell: bash
        env:
          RANTAI_SMOKE: "1"
          RANTAI_SMOKE_TIMEOUT_MS: "120000"
        run: |
          set -euo pipefail
          export RANTAI_SMOKE_REPORT="${RUNNER_TEMP}/rantai-smoke.json"
          echo "RANTAI_SMOKE_REPORT=${RANTAI_SMOKE_REPORT}" >> "${GITHUB_ENV}"

          case "${RUNNER_OS}" in
            Windows) binary=apps/desktop/src-tauri/target/release/rantai.exe ;;
            macOS)   binary="apps/desktop/src-tauri/target/release/bundle/macos/Rantai.app/Contents/MacOS/Rantai" ;;
            *)       binary=apps/desktop/src-tauri/target/release/rantai ;;
          esac
          test -x "${binary}" || { echo "binary tidak ada di ${binary}"; exit 1; }

          if [ "${RUNNER_OS}" = "Linux" ]; then
            xvfb-run -a "${binary}"
          else
            "${binary}"
          fi

      # Release 1 promises a conversation is "saved in SQLite and can be
      # reopened". That is only provable by running the application twice: once
      # to write, once to read after the process has genuinely died.
      #
      # A test inside one process does not prove it — it can pass entirely from
      # an in-memory cache without a single byte touching disk.
      - name: Write data that must persist
        shell: bash
        env:
          RANTAI_SMOKE: "1"
          RANTAI_SMOKE_PERSIST: "tulis"
          RANTAI_SMOKE_TIMEOUT_MS: "120000"
        run: |
          set -euo pipefail
          tanda="persisted-${GITHUB_RUN_ID}-${RUNNER_OS}"
          echo "RANTAI_SMOKE_PERSIST_MARKER=${tanda}" >> "${GITHUB_ENV}"
          export RANTAI_SMOKE_PERSIST_MARKER="${tanda}"
          export RANTAI_SMOKE_REPORT="${RUNNER_TEMP}/rantai-smoke-write.json"

          case "${RUNNER_OS}" in
            Windows) binary=apps/desktop/src-tauri/target/release/rantai.exe ;;
            macOS)   binary="apps/desktop/src-tauri/target/release/bundle/macos/Rantai.app/Contents/MacOS/Rantai" ;;
            *)       binary=apps/desktop/src-tauri/target/release/rantai ;;
          esac

          if [ "${RUNNER_OS}" = "Linux" ]; then
            xvfb-run -a "${binary}"
          else
            "${binary}"
          fi

      - name: Read it back after the application closed
        shell: bash
        env:
          RANTAI_SMOKE: "1"
          RANTAI_SMOKE_PERSIST: "baca"
          RANTAI_SMOKE_TIMEOUT_MS: "120000"
        run: |
          set -euo pipefail
          export RANTAI_SMOKE_REPORT="${RUNNER_TEMP}/rantai-smoke-read.json"

          case "${RUNNER_OS}" in
            Windows) binary=apps/desktop/src-tauri/target/release/rantai.exe ;;
            macOS)   binary="apps/desktop/src-tauri/target/release/bundle/macos/Rantai.app/Contents/MacOS/Rantai" ;;
            *)       binary=apps/desktop/src-tauri/target/release/rantai ;;
          esac

          if [ "${RUNNER_OS}" = "Linux" ]; then
            xvfb-run -a "${binary}"
          else
            "${binary}"
          fi

      # The Den sign-in was built first in Phase 3 on purpose, and this is its
      # least certain part: URL scheme registration behaves differently on every
      # OS, is at its most fragile in development mode, and **was never covered
      # by CI in Rantai at all** — the three green signals there only exercised
      # the webview, React, the bridge and IPC.
      #
      # On Linux and Windows the system hands the link over as a command-line
      # argument, so it can be tested directly. The application is launched with
      # a link, and the interface demands that the right grant reaches the
      # screen — a link that never arrives, or arrives with a different grant,
      # fails this step.
      - name: Run the Den sign-in link check
        if: runner.os != 'macOS'
        shell: bash
        env:
          RANTAI_SMOKE: "1"
          RANTAI_SMOKE_DEEP_LINK: "GRANTTESTCI1234567890"
          RANTAI_SMOKE_TIMEOUT_MS: "120000"
        run: |
          set -euo pipefail
          export RANTAI_SMOKE_REPORT="${RUNNER_TEMP}/rantai-smoke-deeplink.json"
          tautan="openwork://den-auth?grant=${RANTAI_SMOKE_DEEP_LINK}"

          case "${RUNNER_OS}" in
            Windows) binary=apps/desktop/src-tauri/target/release/rantai.exe ;;
            *)       binary=apps/desktop/src-tauri/target/release/rantai ;;
          esac

          if [ "${RUNNER_OS}" = "Linux" ]; then
            xvfb-run -a "${binary}" "${tautan}"
          else
            "${binary}" "${tautan}"
          fi

      # macOS hands deep links over through Apple Events rather than
      # command-line arguments, so the approach above may not hold there. Run as
      # a non-blocking probe: the result says whether the path is the same,
      # without holding a release over something genuinely unknown. Once it is
      # green a few times, `continue-on-error` comes off.
      - name: Probe the sign-in link on macOS (non-blocking)
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        env:
          RANTAI_SMOKE: "1"
          RANTAI_SMOKE_DEEP_LINK: "GRANTTESTCI1234567890"
          RANTAI_SMOKE_TIMEOUT_MS: "60000"
        run: |
          set -euo pipefail
          export RANTAI_SMOKE_REPORT="${RUNNER_TEMP}/rantai-smoke-deeplink.json"
          binary="apps/desktop/src-tauri/target/release/bundle/macos/Rantai.app/Contents/MacOS/Rantai"
          "${binary}" "openwork://den-auth?grant=${RANTAI_SMOKE_DEEP_LINK}"

      # The Phase 4 gate: an installed application must be able to run the
      # engine it shipped with. An installer that carries an engine it cannot
      # actually run is worse than one that carries none, because the failure
      # only shows up on a user's machine.
      #
      # Not enough that the engine starts — the interface demands its source is
      # the bundled sidecar, not some OpenCode that happens to be on the runner.
      - name: Run the engine from the bundle
        shell: bash
        env:
          RANTAI_SMOKE: "1"
          RANTAI_SMOKE_ENGINE: "present"
          RANTAI_SMOKE_TIMEOUT_MS: "180000"
        run: |
          set -euo pipefail
          export RANTAI_SMOKE_REPORT="${RUNNER_TEMP}/rantai-smoke-engine-present.json"

          case "${RUNNER_OS}" in
            Windows) binary=apps/desktop/src-tauri/target/release/rantai.exe ;;
            macOS)   binary="apps/desktop/src-tauri/target/release/bundle/macos/Rantai.app/Contents/MacOS/Rantai" ;;
            *)       binary=apps/desktop/src-tauri/target/release/rantai ;;
          esac

          if [ "${RUNNER_OS}" = "Linux" ]; then
            xvfb-run -a "${binary}"
          else
            "${binary}"
          fi

      # The Phase 2 gate asks for the engine's failure path to be tested: run
      # without the engine binary, and make sure the message names the cause.
      #
      # Now that the engine really is bundled, pointing RANTAI_OPENCODE at
      # nothing is no longer enough — the application would simply find its
      # sidecar. So the sidecar is moved aside first. That is a truer test than
      # the environment variable ever was: it is what a corrupted installation
      # actually looks like.
      - name: Run the check with the engine removed
        shell: bash
        env:
          RANTAI_SMOKE: "1"
          RANTAI_SMOKE_ENGINE: "absent"
          RANTAI_SMOKE_TIMEOUT_MS: "120000"
        run: |
          set -euo pipefail
          export RANTAI_SMOKE_REPORT="${RUNNER_TEMP}/rantai-smoke-engine-absent.json"

          case "${RUNNER_OS}" in
            Windows)
              binary=apps/desktop/src-tauri/target/release/rantai.exe
              engine=apps/desktop/src-tauri/target/release/opencode.exe
              export RANTAI_OPENCODE='C:\nowhere\opencode.exe'
              ;;
            macOS)
              binary="apps/desktop/src-tauri/target/release/bundle/macos/Rantai.app/Contents/MacOS/Rantai"
              engine="apps/desktop/src-tauri/target/release/bundle/macos/Rantai.app/Contents/Resources/opencode"
              export RANTAI_OPENCODE=/nowhere/opencode
              ;;
            *)
              binary=apps/desktop/src-tauri/target/release/rantai
              engine=apps/desktop/src-tauri/target/release/opencode
              export RANTAI_OPENCODE=/nowhere/opencode
              ;;
          esac

          test -f "${engine}" || { echo "expected a bundled engine at ${engine}"; exit 1; }
          mv "${engine}" "${engine}.aside"
          trap 'mv "${engine}.aside" "${engine}" 2>/dev/null || true' EXIT

          if [ "${RUNNER_OS}" = "Linux" ]; then
            xvfb-run -a "${binary}"
          else
            "${binary}"
          fi

      # The Phase 2 gate also asks for no orphaned processes. If the step above
      # left an OpenCode alive, it shows up here.
      - name: Make sure no engine was left behind
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if pgrep -x opencode > /dev/null 2>&1; then
            echo "ada proses opencode yang tertinggal:"
            pgrep -ax opencode
            exit 1
          fi
          echo "tidak ada proses mesin yang tertinggal"

      # The report names which signals arrived, so a failure says what broke —
      # not merely that something did.
      - name: Report
        if: always()
        shell: bash
        run: |
          laporan="${RANTAI_SMOKE_REPORT:-${RUNNER_TEMP}/rantai-smoke.json}"
          echo "### ${{ matrix.webview }} · sinyal" >> "${GITHUB_STEP_SUMMARY}"
          if [ -f "${laporan}" ]; then
            echo '```json' >> "${GITHUB_STEP_SUMMARY}"
            cat "${laporan}" >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
          else
            echo 'Aplikasi tidak pernah menulis laporan — ia gagal sebelum sampai ke sana.' >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload the installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.msi

  # Cheap, fast, and catches a different class of error than the matrix above.
  #
  # NOTE: this job is still named in Indonesian. Renaming it would break branch
  # protection, which matches required checks by name — every open PR would wait
  # forever for a check that no longer reports. Rename it and update the required
  # contexts in the same move, with no PR open.
  checks:
    name: Typecheck dan lint
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install the Linux webview
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rust formatting
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # This test rewrites apps/ui/app/bindings.ts from the command list in
      # Rust. It also runs the SQLite migrations against an in-memory database,
      # so mistyped SQL fails here rather than when the application opens.
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test

      # The Phase 1 gate. If the step above changed bindings.ts, the shape of
      # the data in Rust moved without that file following — and the callers in
      # Next.js may not have followed either. An unclean diff here is the only
      # guard against two definitions of the truth slowly diverging with nobody
      # noticing.
      - name: Make sure bindings.ts is current
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- apps/ui/app/bindings.ts; then
            echo
            echo "bindings.ts tidak mutakhir terhadap perintah di Rust."
            echo "Jalankan: cd apps/desktop/src-tauri && cargo test"
            echo "lalu commit apps/ui/app/bindings.ts."
            exit 1
          fi
          echo "bindings.ts mutakhir"

      # Run after bindings are confirmed current — otherwise the typecheck could
      # pass against a stale file and hide the very thing this gate guards.
      - name: Typecheck the interface
        working-directory: apps/ui
        run: bun run typecheck

      # Interface tests. The Den sign-in link parsers are tested here — the part
      # of the sign-in testable without a window, without Tauri and without Den.
      # Shrinking the untestable part as far as it will go is the whole strategy
      # of Phase 3; what is left is two native touches.
      - name: Interface tests
        working-directory: apps/ui
        run: bun test
