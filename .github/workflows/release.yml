# Installers that can genuinely be installed, from every state of main.
#
# This is what makes the Phase 3 gate workable: "used for real work for a week"
# needs an installed application, not a CI artifact that expires in 90 days.
#
# Two kinds of output:
#
#   push to main  -> a rolling pre-release `main-terbaru` whose assets are
#                    replaced on every merge. Always points at the latest main.
#   tag v*        -> a real release under that tag, never overwritten.
#
# The overlap with "Skeleton · three platforms" is deliberate. That one is the
# gate that blocks merges; this one publishes. Both build the same commit, and a
# public repository pays nothing for Actions minutes — so the clarity is free.
#
# Nothing is published without being run first: every runner runs the
# application in smoke mode before its installer goes up to Releases.

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Successive merges need not wait for each other, and finishing an older one is
# pointless — its assets would be overwritten by the newer run immediately.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.0"

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
          - os: macos-14
            label: macOS
          - os: windows-latest
            label: Windows

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install the Linux webview and display
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The engine is ~176 MB and is not in the repository, so a clean checkout
      # has none. It is fetched here and verified against the sha256 pinned in
      # apps/desktop/opencode.json — a mismatch stops the build rather than
      # shipping an archive nobody vouched for.
      #
      # Cached by version and target, because 176 MB per job adds up.
      - name: Cache the OpenCode engine
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: apps/desktop/src-tauri/binaries
          key: opencode-${{ hashFiles('apps/desktop/opencode.json') }}-${{ runner.os }}-${{ runner.arch }}

      - name: Fetch the OpenCode engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: bun run sidecar

      - name: Build the interface
        working-directory: apps/ui
        run: bun run build

      - name: Make sure the interface really exported
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/ui/out/index.html \
            || { echo "apps/ui/out/index.html tidak ada — next build tidak menghasilkan apa pun"; exit 1; }

      # The updater's own signing key, not an OS code-signing certificate —
      # those are separate things. This one proves an update came from this
      # repository and costs nothing; it is generated locally with
      # `tauri signer generate`. An installed application refuses any update not
      # signed by it, so losing the key means no installation already out there
      # can ever be updated again.
      - name: Build the installer
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # createUpdaterArtifacts lives here rather than in tauri.conf.json.
        #
        # With it in the config, *every* build demands the signing key —
        # including the gate workflow on every pull request, which failed on all
        # three platforms with "A public key has been found, but no private key".
        # Updater artifacts are only needed when publishing, so the key only ever
        # needs to reach this workflow.
        run: bun run tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'

      # The binary under test must be the one produced by `tauri build` above.
      # The debug or release profile is not what decides it: a plain
      # `cargo build --release` still produces a dev context and loads devUrl
      # rather than the embedded export.
      - name: Run the webview check before publishing
        shell: bash
        env:
          RANTAI_SMOKE: "1"
          RANTAI_SMOKE_ENGINE: "present"
          RANTAI_SMOKE_TIMEOUT_MS: "180000"
        run: |
          set -euo pipefail
          export RANTAI_SMOKE_REPORT="${RUNNER_TEMP}/rantai-smoke.json"

          case "${RUNNER_OS}" in
            Windows) binary=apps/desktop/src-tauri/target/release/rantai.exe ;;
            macOS)   binary="apps/desktop/src-tauri/target/release/bundle/macos/Rantai.app/Contents/MacOS/Rantai" ;;
            *)       binary=apps/desktop/src-tauri/target/release/rantai ;;
          esac
          test -x "${binary}" || { echo "binary missing at ${binary}"; exit 1; }

          if [ "${RUNNER_OS}" = "Linux" ]; then
            xvfb-run -a "${binary}"
          else
            "${binary}"
          fi

      - name: Collect the installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          bundle=apps/desktop/src-tauri/target/release/bundle
          test -d "${bundle}" || { echo "no bundle directory"; exit 1; }

          # The updater artifacts and their .sig files come along too: the
          # updater downloads the archive, not the installer, and refuses it
          # without the matching signature.
          find "${bundle}" -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \
               -o -name '*.tar.gz' -o -name '*.zip' -o -name '*.sig' \) \
            -exec cp {} output/ \;

          count=$(find output -type f | wc -l)
          test "${count}" -gt 0 || { echo "no installers were collected"; exit 1; }
          echo "collected ${count} installers:"
          ls -lh output

      - name: Upload for the publishing stage
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: output/*
          if-no-files-found: error

  publish:
    name: Publish to Releases
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ambil semua installer
        uses: actions/download-artifact@v4
        with:
          path: output
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          ls -lh output
          test -n "$(ls -A output)" || { echo "nothing to publish"; exit 1; }

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # A real release. Never deleted and never moved.
            tag="${GITHUB_REF#refs/tags/}"
            title="Rantai ${tag}"
            notes="Release ${tag}."
            prerelease=""
          else
            # A rolling pre-release. The old tag is dropped along with its
            # release so that it really points at the latest commit, not the
            # first one that ever created it.
            tag="main-terbaru"
            title="Rantai — latest main"
            notes="Built automatically from main @ ${GITHUB_SHA}. Unsigned: Windows shows a SmartScreen warning, and macOS blocks it through Gatekeeper until it is opened with a right-click."
            prerelease="--prerelease"
            gh release delete "${tag}" --yes --cleanup-tag 2>/dev/null || true
          fi

          if ! gh release view "${tag}" >/dev/null 2>&1; then
            # shellcheck disable=SC2086
            gh release create "${tag}" \
              --target "${GITHUB_SHA}" \
              --title "${title}" \
              --notes "${notes}" \
              ${prerelease}
          fi

          # The updater manifest — for tagged releases only.
          #
          # The rolling `main-terbaru` build always carries the version in
          # tauri.conf.json, and an updater only offers a version *higher* than
          # the one installed. A manifest from the rolling build could therefore
          # never trigger an update; it would only ever be fetched and rejected.
          #
          # So updates are driven by `v*` tags. To ship one: bump the version in
          # tauri.conf.json, then push a tag.
          #
          # Built here rather than by the bundler, because it has to describe all
          # three platforms at once and each was built on a different runner.
          #
          # A platform with no signature is left out entirely. An entry that
          # points at an artifact the updater cannot verify is worse than no
          # entry: the application would find an update, download it, and refuse
          # it — every single time it checked.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          python3 - "${tag}" "${GITHUB_SHA}" <<'PY'
          import json, os, sys, pathlib, datetime

          tag, sha = sys.argv[1], sys.argv[2]
          version = tag[1:] if tag.startswith("v") else "0.0.0"
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"

          # Artifacts are discovered from the .sig files that actually exist, not from a
          # table of expected names.
          #
          # The table was wrong on its first contact with reality: it expected
          # `.AppImage.tar.gz` for Linux, which is the Tauri v1 convention. Tauri 2 signs
          # the .AppImage itself. Having been wrong about one platform, the entries for the
          # other two were no more trustworthy — and neither could be checked from a Linux
          # machine.
          def platform_for(name):
              if name.endswith(".AppImage"):
                  return "linux-x86_64"
              if name.endswith(".app.tar.gz"):
                  return "darwin-aarch64"
              if name.endswith(".nsis.zip") or name.endswith("-setup.exe"):
                  return "windows-x86_64"
              return None

          out = pathlib.Path("output")
          platforms = {}
          for signature in sorted(out.glob("*.sig")):
              artifact = out / signature.name[: -len(".sig")]
              if not artifact.exists():
                  print(f"latest.json: {signature.name} has no artifact beside it — skipping")
                  continue
              key = platform_for(artifact.name)
              if key is None:
                  print(f"latest.json: {artifact.name} is signed but not an update target — skipping")
                  continue
              if key in platforms:
                  print(f"latest.json: more than one candidate for {key}; keeping the first")
                  continue
              platforms[key] = {
                  "signature": signature.read_text().strip(),
                  "url": f"{base}/{artifact.name}",
              }

          if not platforms:
              # An empty manifest would be worse than none: the application would find an
              # update, download nothing, and report a failure on every check.
              print("latest.json: no signed artifacts at all — not writing a manifest")
              sys.exit(0)

          for missing in {"linux-x86_64", "darwin-aarch64", "windows-x86_64"} - set(platforms):
              print(f"latest.json: nothing for {missing} — that platform gets no update")

          manifest = {
              "version": version,
              "notes": f"Built from {sha[:9]}.",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "platforms": platforms,
          }
          (out / "latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(f"latest.json: {', '.join(sorted(platforms))}")
          PY
          else
            echo "latest.json: skipped — the rolling build cannot drive updates"
          fi

          gh release upload "${tag}" output/* --clobber

          echo "### Published: ${title}" >> "${GITHUB_STEP_SUMMARY}"
          gh release view "${tag}" --json assets \
            --jq '.assets[] | "  \(.name)  \(.size/1048576 | floor)MB"' >> "${GITHUB_STEP_SUMMARY}"
