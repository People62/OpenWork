# Gerbang Fase 0: installer terbangun dan jendelanya *terbuka* di Windows,
# macOS, dan Linux — di CI, bukan hanya di VM pengembangan.
#
# Tauri memakai webview bawaan sistem, jadi "lintas platform" berarti tiga mesin
# render, bukan satu: WebKitGTK di Linux, WKWebView di macOS, WebView2 di
# Windows. Perbedaan di antara ketiganya tidak pernah muncul saat typecheck. Ini
# hal termurah dikerjakan di commit pertama dan termahal ditunda.
#
# Pemeriksaannya bukan tangkapan layar. Aplikasi dijalankan sungguhan dalam mode
# smoke dan menunggu dua sinyal yang berurutan — yang kedua tidak mungkin tiba
# kalau yang pertama tidak:
#
#   1. webview-termuat — halaman termuat, bundel jalan, React ter-mount
#   2. ipc-bulat       — jawaban Rust sampai ke layar lalu kembali ke Rust
#
# Keduanya tiba: keluar 0. Lewat batas waktu: keluar 1, menyebutkan sinyal mana
# yang tidak pernah datang.

name: Kerangka · tiga platform

# `push` sengaja dibatasi ke main saja. Sebelumnya ia mencakup semua cabang
# sekaligus `pull_request`, dan akibatnya tiap PR membangun Rust enam kali
# bukan tiga: satu putaran untuk push ke cabangnya, satu lagi untuk PR-nya.
# Keduanya menguji commit yang sama dan melaporkan nama cek yang sama, jadi
# keduanya muncul sebagai "Required" di kotak merge dan waktu tunggunya
# berlipat tanpa menambah satu pun informasi.
#
# Konsekuensinya: cabang yang di-push tanpa PR tidak diperiksa. Itu disengaja —
# gerbangnya adalah merge ke main, dan tiap merge ke main lewat PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Push beruntun ke PR yang sama tidak perlu diselesaikan semuanya; hanya commit
# terakhir yang akan di-merge.
concurrency:
  group: kerangka-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.0"

jobs:
  kerangka:
    name: ${{ matrix.webview }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            webview: WebKitGTK (Linux)
          - os: macos-14
            webview: WKWebView (macOS)
          - os: windows-latest
            webview: WebView2 (Windows)

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Siapkan Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Siapkan Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Simpan cache build Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # WebKitGTK dan header pengembangannya tidak ada di runner Ubuntu, dan
      # Xvfb satu-satunya tampilan yang ia punya. macOS dan Windows sudah
      # membawa webview-nya sendiri.
      - name: Pasang webview dan tampilan Linux
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb

      - name: Pasang dependensi
        run: bun install --frozen-lockfile

      - name: Bangun antarmuka
        working-directory: apps/ui
        run: bun run build

      # Langkah CI yang hijau belum tentu mengerjakan sesuatu. Langkah di atas
      # bisa lulus sambil tidak menghasilkan apa pun, dan `tauri build`
      # berikutnya akan diam-diam memakai keluaran lama.
      - name: Pastikan antarmuka benar-benar ter-export
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/ui/out/index.html \
            || { echo "apps/ui/out/index.html tidak ada — next build tidak menghasilkan apa pun"; exit 1; }
          echo "out/ berisi $(find apps/ui/out -type f | wc -l) berkas"

      - name: Bangun installer
        working-directory: apps/desktop
        run: bun run tauri build

      - name: Sebutkan installer yang terbangun
        shell: bash
        run: |
          set -euo pipefail
          bundle=apps/desktop/src-tauri/target/release/bundle
          test -d "${bundle}" || { echo "tidak ada direktori bundle — tidak ada installer yang terbangun"; exit 1; }
          echo "### ${{ matrix.webview }} · installer" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          find "${bundle}" -maxdepth 2 -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) \
            -exec ls -lh {} \; | tee -a "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"

      # Binary yang diuji harus yang dihasilkan langkah `tauri build` di atas.
      # Yang menentukan bukan profil debug atau release: `cargo build --release`
      # biasa tetap menghasilkan konteks dev, dan aplikasinya akan memuat devUrl
      # alih-alih hasil export yang tertanam. Jangan pernah menyelipkan
      # `cargo build` di antara kedua langkah ini — itu menimpa binary yang benar
      # dengan yang salah, dan kegagalannya tampak seperti webview yang mati.
      - name: Jalankan pemeriksaan webview
        shell: bash
        env:
          RANTAI_SMOKE: "1"
          RANTAI_SMOKE_TIMEOUT_MS: "120000"
        run: |
          set -euo pipefail
          export RANTAI_SMOKE_REPORT="${RUNNER_TEMP}/rantai-smoke.json"
          echo "RANTAI_SMOKE_REPORT=${RANTAI_SMOKE_REPORT}" >> "${GITHUB_ENV}"

          case "${RUNNER_OS}" in
            Windows) binary=apps/desktop/src-tauri/target/release/rantai.exe ;;
            macOS)   binary="apps/desktop/src-tauri/target/release/bundle/macos/Rantai.app/Contents/MacOS/Rantai" ;;
            *)       binary=apps/desktop/src-tauri/target/release/rantai ;;
          esac
          test -x "${binary}" || { echo "binary tidak ada di ${binary}"; exit 1; }

          if [ "${RUNNER_OS}" = "Linux" ]; then
            xvfb-run -a "${binary}"
          else
            "${binary}"
          fi

      # Rilis 1 menjanjikan percakapan "tersimpan di SQLite dan bisa dibuka
      # kembali". Itu hanya terbukti dengan menjalankan aplikasi dua kali:
      # sekali menulis, sekali membaca sesudah prosesnya benar-benar mati.
      #
      # Tes dalam satu proses tidak membuktikannya — ia bisa lulus sepenuhnya
      # dari cache di memori tanpa satu byte pun menyentuh disk.
      - name: Tulis data yang harus bertahan
        shell: bash
        env:
          RANTAI_SMOKE: "1"
          RANTAI_SMOKE_SIMPAN: "tulis"
          RANTAI_SMOKE_TIMEOUT_MS: "120000"
        run: |
          set -euo pipefail
          tanda="bertahan-${GITHUB_RUN_ID}-${RUNNER_OS}"
          echo "RANTAI_SMOKE_SIMPAN_TANDA=${tanda}" >> "${GITHUB_ENV}"
          export RANTAI_SMOKE_SIMPAN_TANDA="${tanda}"
          export RANTAI_SMOKE_REPORT="${RUNNER_TEMP}/rantai-smoke-tulis.json"

          case "${RUNNER_OS}" in
            Windows) binary=apps/desktop/src-tauri/target/release/rantai.exe ;;
            macOS)   binary="apps/desktop/src-tauri/target/release/bundle/macos/Rantai.app/Contents/MacOS/Rantai" ;;
            *)       binary=apps/desktop/src-tauri/target/release/rantai ;;
          esac

          if [ "${RUNNER_OS}" = "Linux" ]; then
            xvfb-run -a "${binary}"
          else
            "${binary}"
          fi

      - name: Baca kembali sesudah aplikasi ditutup
        shell: bash
        env:
          RANTAI_SMOKE: "1"
          RANTAI_SMOKE_SIMPAN: "baca"
          RANTAI_SMOKE_TIMEOUT_MS: "120000"
        run: |
          set -euo pipefail
          export RANTAI_SMOKE_REPORT="${RUNNER_TEMP}/rantai-smoke-baca.json"

          case "${RUNNER_OS}" in
            Windows) binary=apps/desktop/src-tauri/target/release/rantai.exe ;;
            macOS)   binary="apps/desktop/src-tauri/target/release/bundle/macos/Rantai.app/Contents/MacOS/Rantai" ;;
            *)       binary=apps/desktop/src-tauri/target/release/rantai ;;
          esac

          if [ "${RUNNER_OS}" = "Linux" ]; then
            xvfb-run -a "${binary}"
          else
            "${binary}"
          fi

      # Alur masuk Den digarap paling awal di Fase 3 dengan sengaja, dan inilah
      # bagiannya yang paling tidak pasti: registrasi skema URL berperilaku
      # berbeda tiap OS, paling rapuh di mode pengembangan, dan **di Rantai
      # tidak pernah tercakup uji CI sama sekali** — tiga sinyal hijau di sana
      # hanya menguji webview, React, bridge, dan IPC.
      #
      # Di Linux dan Windows, sistem menyerahkan tautan lewat argumen baris
      # perintah, jadi ia bisa diuji langsung. Aplikasi diluncurkan dengan
      # tautan, dan antarmuka menuntut grant yang benar sampai ke layar —
      # tautan yang tidak sampai, atau sampai dengan grant lain, menggagalkan
      # langkah ini.
      - name: Jalankan pemeriksaan tautan masuk Den
        if: runner.os != 'macOS'
        shell: bash
        env:
          RANTAI_SMOKE: "1"
          RANTAI_SMOKE_TAUTAN: "GRANTUJICOBACI1234567890"
          RANTAI_SMOKE_TIMEOUT_MS: "120000"
        run: |
          set -euo pipefail
          export RANTAI_SMOKE_REPORT="${RUNNER_TEMP}/rantai-smoke-tautan.json"
          tautan="openwork://den-auth?grant=${RANTAI_SMOKE_TAUTAN}"

          case "${RUNNER_OS}" in
            Windows) binary=apps/desktop/src-tauri/target/release/rantai.exe ;;
            *)       binary=apps/desktop/src-tauri/target/release/rantai ;;
          esac

          if [ "${RUNNER_OS}" = "Linux" ]; then
            xvfb-run -a "${binary}" "${tautan}"
          else
            "${binary}" "${tautan}"
          fi

      # macOS menyerahkan deep link lewat Apple Events, bukan argumen baris
      # perintah, jadi cara di atas belum tentu berlaku di sana. Dijalankan
      # sebagai penyelidikan yang tidak memblokir: hasilnya memberi tahu apakah
      # jalurnya sama, tanpa menahan rilis atas sesuatu yang memang belum
      # diketahui. Kalau ia hijau berkali-kali, `continue-on-error` dilepas.
      - name: Selidiki tautan masuk di macOS (tidak memblokir)
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        env:
          RANTAI_SMOKE: "1"
          RANTAI_SMOKE_TAUTAN: "GRANTUJICOBACI1234567890"
          RANTAI_SMOKE_TIMEOUT_MS: "60000"
        run: |
          set -euo pipefail
          export RANTAI_SMOKE_REPORT="${RUNNER_TEMP}/rantai-smoke-tautan.json"
          binary="apps/desktop/src-tauri/target/release/bundle/macos/Rantai.app/Contents/MacOS/Rantai"
          "${binary}" "openwork://den-auth?grant=${RANTAI_SMOKE_TAUTAN}"

      # Gerbang Fase 2 menuntut jalur gagal mesin diuji: jalankan tanpa binary
      # mesin, dan pastikan pesannya benar. OpenCode 176 MB dan tidak ikut di
      # dalam repo — tapi menguji *ketiadaannya* justru tidak butuh unduhan apa
      # pun, jadi bagian gerbang ini berjalan di tiap putaran, di ketiga
      # platform, dengan harga nol.
      #
      # RANTAI_OPENCODE menunjuk ketiadaan, dan antarmuka menuntut pesannya
      # menyebut penyebabnya. Kalau mesin justru menyala — karena runner
      # kebetulan punya OpenCode — antarmuka menggagalkan smoke alih-alih
      # diam-diam lolos. Pengujian yang tidak menguasai masukannya sudah pernah
      # membuat tiga percobaan reproduksi di Rantai sia-sia.
      - name: Jalankan pemeriksaan tanpa binary mesin
        shell: bash
        env:
          RANTAI_SMOKE: "1"
          RANTAI_SMOKE_MESIN_ABSEN: "1"
          RANTAI_SMOKE_TIMEOUT_MS: "120000"
        run: |
          set -euo pipefail
          export RANTAI_SMOKE_REPORT="${RUNNER_TEMP}/rantai-smoke-mesin.json"
          case "${RUNNER_OS}" in
            Windows) export RANTAI_OPENCODE='C:\jalan\yang\sengaja\tidak\ada\opencode.exe' ;;
            *)       export RANTAI_OPENCODE=/jalan/yang/sengaja/tidak/ada/opencode ;;
          esac

          case "${RUNNER_OS}" in
            Windows) binary=apps/desktop/src-tauri/target/release/rantai.exe ;;
            macOS)   binary="apps/desktop/src-tauri/target/release/bundle/macos/Rantai.app/Contents/MacOS/Rantai" ;;
            *)       binary=apps/desktop/src-tauri/target/release/rantai ;;
          esac

          if [ "${RUNNER_OS}" = "Linux" ]; then
            xvfb-run -a "${binary}"
          else
            "${binary}"
          fi

      # Gerbang Fase 2 juga menuntut tidak ada proses yatim. Kalau langkah di
      # atas meninggalkan OpenCode hidup, ia akan terlihat di sini.
      - name: Pastikan tidak ada mesin yang tertinggal
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if pgrep -x opencode > /dev/null 2>&1; then
            echo "ada proses opencode yang tertinggal:"
            pgrep -ax opencode
            exit 1
          fi
          echo "tidak ada proses mesin yang tertinggal"

      # Laporannya menyebut sinyal mana yang tiba, jadi kegagalan mengatakan apa
      # yang rusak — bukan hanya bahwa sesuatu rusak.
      - name: Laporan
        if: always()
        shell: bash
        run: |
          laporan="${RANTAI_SMOKE_REPORT:-${RUNNER_TEMP}/rantai-smoke.json}"
          echo "### ${{ matrix.webview }} · sinyal" >> "${GITHUB_STEP_SUMMARY}"
          if [ -f "${laporan}" ]; then
            echo '```json' >> "${GITHUB_STEP_SUMMARY}"
            cat "${laporan}" >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
          else
            echo 'Aplikasi tidak pernah menulis laporan — ia gagal sebelum sampai ke sana.' >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Unggah installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.msi

  # Murah, cepat, dan menangkap kelas galat yang berbeda dari matriks di atas.
  periksa:
    name: Typecheck dan lint
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Siapkan Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Siapkan Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Simpan cache build Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Pasang webview Linux
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev

      - name: Pasang dependensi
        run: bun install --frozen-lockfile

      - name: Format Rust
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Tes ini menulis ulang apps/ui/app/bindings.ts dari daftar perintah di
      # Rust. Ia juga menjalankan migrasi SQLite terhadap basis data di memori,
      # jadi SQL yang salah ketik gagal di sini, bukan saat aplikasi dibuka.
      - name: Tes Rust
        working-directory: apps/desktop/src-tauri
        run: cargo test

      # Gerbang Fase 1. Kalau langkah di atas mengubah bindings.ts, berarti
      # bentuk data di Rust bergerak tanpa berkas itu ikut diperbarui — dan
      # pemanggil di Next.js belum tentu menyusul. Diff yang tidak bersih di
      # sini adalah satu-satunya penangkal terhadap dua definisi kebenaran yang
      # perlahan berbeda tanpa ada yang menyadarinya.
      - name: Pastikan bindings.ts mutakhir
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- apps/ui/app/bindings.ts; then
            echo
            echo "bindings.ts tidak mutakhir terhadap perintah di Rust."
            echo "Jalankan: cd apps/desktop/src-tauri && cargo test"
            echo "lalu commit apps/ui/app/bindings.ts."
            exit 1
          fi
          echo "bindings.ts mutakhir"

      # Dijalankan setelah bindings dipastikan mutakhir — kalau tidak, typecheck
      # bisa lulus terhadap berkas lama dan menyembunyikan justru hal yang
      # gerbang ini jaga.
      - name: Typecheck antarmuka
        working-directory: apps/ui
        run: bun run typecheck

      # Tes antarmuka. Pengurai tautan masuk Den diuji di sini — bagian alur
      # masuk yang bisa diuji tanpa jendela, tanpa Tauri, dan tanpa Den.
      # Menyempitkan yang tidak terujikan sekecil mungkin adalah seluruh
      # strategi Fase 3; yang tersisa hanya dua sentuhan native.
      - name: Tes antarmuka
        working-directory: apps/ui
        run: bun test
