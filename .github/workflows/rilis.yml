# Installer yang bisa benar-benar dipasang, dari tiap keadaan main.
#
# Ini yang membuat gerbang Fase 3 mungkin dikerjakan: "dipakai sendiri untuk
# pekerjaan nyata selama seminggu" menuntut aplikasi yang terpasang, bukan
# artifact CI yang kedaluwarsa dalam 90 hari.
#
# Dua bentuk keluaran:
#
#   push ke main   -> pra-rilis bergulir `main-terbaru`, asetnya diganti tiap
#                     merge. Selalu menunjuk keadaan main paling akhir.
#   tag v*         -> rilis sungguhan dengan tag itu, tidak pernah ditimpa.
#
# Tumpang tindih dengan "Kerangka · tiga platform" disengaja. Yang itu adalah
# gerbang yang memblokir merge; yang ini yang menerbitkan. Keduanya membangun
# pada commit yang sama, dan repo publik tidak membayar menit Actions — jadi
# kejelasan dibeli dengan harga nol.
#
# Tidak ada yang diterbitkan tanpa dijalankan lebih dulu: tiap runner menjalankan
# aplikasinya dalam mode smoke sebelum installernya naik ke Releases.

name: Rilis

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Merge beruntun tidak perlu saling menunggu, dan yang lama tidak ada gunanya
# diselesaikan — asetnya akan langsung ditimpa yang lebih baru.
concurrency:
  group: rilis-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.0"

jobs:
  bangun:
    name: ${{ matrix.sebutan }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            sebutan: Linux
          - os: macos-14
            sebutan: macOS
          - os: windows-latest
            sebutan: Windows

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Siapkan Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Siapkan Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Simpan cache build Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Pasang webview dan tampilan Linux
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb

      - name: Pasang dependensi
        run: bun install --frozen-lockfile

      - name: Bangun antarmuka
        working-directory: apps/ui
        run: bun run build

      - name: Pastikan antarmuka benar-benar ter-export
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/ui/out/index.html \
            || { echo "apps/ui/out/index.html tidak ada — next build tidak menghasilkan apa pun"; exit 1; }

      - name: Bangun installer
        working-directory: apps/desktop
        run: bun run tauri build

      # Binary yang diuji harus yang dihasilkan `tauri build` di atas. Profil
      # debug atau release bukan yang menentukan: `cargo build --release` biasa
      # tetap menghasilkan konteks dev dan memuat devUrl, bukan hasil export yang
      # tertanam.
      - name: Jalankan pemeriksaan webview sebelum menerbitkan
        shell: bash
        env:
          RANTAI_SMOKE: "1"
          RANTAI_SMOKE_TIMEOUT_MS: "120000"
        run: |
          set -euo pipefail
          export RANTAI_SMOKE_REPORT="${RUNNER_TEMP}/rantai-smoke.json"

          case "${RUNNER_OS}" in
            Windows) binary=apps/desktop/src-tauri/target/release/rantai.exe ;;
            macOS)   binary="apps/desktop/src-tauri/target/release/bundle/macos/Rantai.app/Contents/MacOS/Rantai" ;;
            *)       binary=apps/desktop/src-tauri/target/release/rantai ;;
          esac
          test -x "${binary}" || { echo "binary tidak ada di ${binary}"; exit 1; }

          if [ "${RUNNER_OS}" = "Linux" ]; then
            xvfb-run -a "${binary}"
          else
            "${binary}"
          fi

      - name: Kumpulkan installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p keluaran
          bundle=apps/desktop/src-tauri/target/release/bundle
          test -d "${bundle}" || { echo "tidak ada direktori bundle"; exit 1; }

          find "${bundle}" -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) \
            -exec cp {} keluaran/ \;

          jumlah=$(find keluaran -type f | wc -l)
          test "${jumlah}" -gt 0 || { echo "tidak ada installer yang terkumpul"; exit 1; }
          echo "terkumpul ${jumlah} installer:"
          ls -lh keluaran

      - name: Unggah untuk tahap penerbitan
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: keluaran/*
          if-no-files-found: error

  terbitkan:
    name: Terbitkan ke Releases
    needs: bangun
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ambil semua installer
        uses: actions/download-artifact@v4
        with:
          path: keluaran
          merge-multiple: true

      - name: Terbitkan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          ls -lh keluaran
          test -n "$(ls -A keluaran)" || { echo "tidak ada berkas untuk diterbitkan"; exit 1; }

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Rilis sungguhan. Tidak pernah dihapus dan tidak pernah dipindahkan.
            tag="${GITHUB_REF#refs/tags/}"
            judul="Rantai ${tag}"
            catatan="Rilis ${tag}."
            praRilis=""
          else
            # Pra-rilis bergulir. Tag lama dibuang berikut rilisnya supaya ia
            # benar-benar menunjuk commit terakhir, bukan commit pertama yang
            # pernah membuatnya.
            tag="main-terbaru"
            judul="Rantai — main terbaru"
            catatan="Dibangun otomatis dari main @ ${GITHUB_SHA}. Belum ditandatangani: Windows menampilkan peringatan SmartScreen, dan macOS memblokir lewat Gatekeeper sampai dibuka lewat klik kanan."
            praRilis="--prerelease"
            gh release delete "${tag}" --yes --cleanup-tag 2>/dev/null || true
          fi

          if ! gh release view "${tag}" >/dev/null 2>&1; then
            # shellcheck disable=SC2086
            gh release create "${tag}" \
              --target "${GITHUB_SHA}" \
              --title "${judul}" \
              --notes "${catatan}" \
              ${praRilis}
          fi

          gh release upload "${tag}" keluaran/* --clobber

          echo "### Terbit: ${judul}" >> "${GITHUB_STEP_SUMMARY}"
          gh release view "${tag}" --json assets \
            --jq '.assets[] | "  \(.name)  \(.size/1048576 | floor)MB"' >> "${GITHUB_STEP_SUMMARY}"
