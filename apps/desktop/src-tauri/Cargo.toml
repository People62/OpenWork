[package]
name = "rantai"
version = "0.0.1"
edition = "2021"
description = "Rantai — cangkang desktop Tauri berikut BE lokalnya, satu proses Rust."
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
uuid = { version = "1.26.1", features = ["v4"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[profile.dev]
incremental = true

[profile.release]
# Binary yang lebih kecil dan cepat; biaya waktu build dibayar di CI, bukan di
# putaran pengembangan.
codegen-units = 1
lto = true
strip = true
