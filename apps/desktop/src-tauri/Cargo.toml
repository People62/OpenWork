[package]
name = "rantai"
version = "0.0.1"
edition = "2021"
description = "Rantai — cangkang desktop Tauri berikut BE lokalnya, satu proses Rust."
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
uuid = { version = "1.26.1", features = ["v4"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tokio = { version = "1.53.1", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
thiserror = "2.0.20"
# Tanpa TLS: satu-satunya yang diajak bicara Rust lewat HTTP adalah proses
# OpenCode di 127.0.0.1. Den diurus sisi TypeScript, bukan dari sini. Menyalakan
# rustls berarti menyeret aws-lc dan seluruh rantainya tanpa ada yang memakainya.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-opener = "2.5.5"
url = "2.5.8"
tauri-plugin-dialog = "2.7.3"

[profile.dev]
incremental = true

[profile.release]
# Binary yang lebih kecil dan cepat; biaya waktu build dibayar di CI, bukan di
# putaran pengembangan.
codegen-units = 1
lto = true
strip = true
